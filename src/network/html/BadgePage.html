<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>名牌製作</title>
<style>
:root{color-scheme:light;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#1F2937;background:#FFFBF7}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid #E7DDD0;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
h3{margin:0;font-size:18px}
label{display:block;font-size:14px;color:#374151}
input[type=file],input[type=text]{font:inherit;font-size:16px;border:1px solid #E7DDD0;border-radius:10px;padding:8px 12px;background:#FFF7ED;color:#1F2937;width:100%}
button{font:inherit;font-size:16px;border:1px solid #E7DDD0;border-radius:10px;padding:9px 14px;background:#FFF7ED;color:#1F2937;cursor:pointer}
button.primary{background:#F97316;border-color:#F97316;color:#111;font-weight:700}
canvas{width:auto;max-width:100%;border:1px solid #E7DDD0;border-radius:8px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.preview{display:flex;justify-content:center}
.small{font-size:13px;color:#6B7280;margin:0}
#status:empty{display:none}
</style>
<div class="wrap">
  <div class="card"><h3>名牌製作（直向 480×800）</h3>
    <p class="small">上傳照片、填姓名／職稱與載具號碼；版面：公司 logo → 照片 → 名字 → 條碼。存到裝置後設成待機「名牌」。</p></div>
  <div class="card">
    <label>照片 <input type="file" id="photo" accept="image/*"></label>
    <label style="flex-direction:row;align-items:center;gap:10px">顯示照片
      <input type="checkbox" id="showPhoto" checked style="width:20px;height:20px">
    </label>
    <label>姓名 <input type="text" id="name" maxlength="12" placeholder="你的名字"></label>
    <label>職稱 <input type="text" id="title" maxlength="20" placeholder="職稱"></label>
    <label>排版 <select id="layout" style="font:inherit;font-size:16px;padding:8px 12px;border:1px solid #E7DDD0;border-radius:10px;background:#FFF7ED;width:100%">
      <option value="classic">經典（照片在上、大字在下）</option>
      <option value="badge">工牌（同事版：黑底標題列＋大名字＋QR）</option>
    </select></label>
    <div id="badgeOnly" style="display:none">
      <label>標題列主字（不填＝用 logo） <input type="text" id="headMain" maxlength="14" placeholder="例：INTERAGENT" spellcheck="false"></label>
      <label>標題列副字（小字、字距拉開） <input type="text" id="headSub" maxlength="30" placeholder="例：STAFF IDENTIFICATION" spellcheck="false"></label>
      <label>員工編號 <input type="text" id="agentId" maxlength="20" placeholder="SR-D9AC" spellcheck="false"></label>
      <label>部門／標語 <input type="text" id="division" maxlength="40" placeholder="SCIENCE &amp; TECHNOLOGY DIVISION" spellcheck="false"></label>
      <label>權限等級 <input type="text" id="clearance" maxlength="6" placeholder="7" spellcheck="false"></label>
    </div>
    <label>條碼類型 <select id="codeType" style="font:inherit;font-size:16px;padding:8px 12px;border:1px solid #E7DDD0;border-radius:10px;background:#FFF7ED;width:100%">
      <option value="barcode">一維碼（Code 39）</option>
      <option value="qr">QR Code</option>
      <option value="none">不顯示</option>
    </select></label>
    <label>內容（載具號碼或網址） <input type="text" id="codeValue" maxlength="120" placeholder="/SM6OLEQ 或 https://…" spellcheck="false"></label>
    <label>照片抖色顆粒 <select id="ditherCell" style="font:inherit;font-size:16px;padding:8px 12px;border:1px solid #E7DDD0;border-radius:10px;background:#FFF7ED;width:100%">
      <option value="1">細 1px（不建議，這片面板會糊）</option>
      <option value="2" selected>中 2px（建議起點）</option>
      <option value="3">粗 3px（面板最吃得下）</option>
    </select></label>
    <p id="carrierStatus" class="small">一維碼請填 / 開頭 8 碼載具號；QR Code 可填任意網址或文字。</p>
  </div>
  <div class="card">
    <div class="preview"><canvas id="cv" width="480" height="800"></canvas></div>
    <div class="row"><button id="render">重新預覽</button><button id="save" class="primary">存到裝置（待機名牌）</button></div>
    <p class="small">存檔位置：<b>/.crosspoint/badge.bmp</b>；裝置端：<b>設定 → 顯示 → 休眠屏幕 → 名牌</b>。</p>
    <p id="status" class="small"></p>
  </div>
</div>
<img id="logoImg" alt="" style="display:none" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQoAAABICAYAAAAOLLsaAAADlElEQVR42u2dy3IsIAhEbcv//2Xu+iabTOKjgdNV2U1qHBpaRFSN84gPPqsBALCDHgnCy3ECAC4HYCQWNgDA4cCLYtkQAGBjsEXhpdNtBCJpY2/B+54vjtGn1uLoILd+fzy09e7vdimil+BdBUTCWSyi4FJS5rtiYeA75XhXEZFwE4tIZIdItFMm85S+LO+zkEg4jDlM7PbTcUQRrgLfO8v7LCQSr8ce2OL6uByEOQztvH08s5hIvPoNYW6LKMgzWcRF3ucYLbfDKs8m7k4dLDHz8b4uEaBitZCRuIajIlkjvF/kfRlUX3W4yCWchSUHtvvb2OcBI2jD/wtHBYiED+bmLEI0UAGAUIyEDVQEN+jSnXwMa5MhdJjILlthOG1PkbDnfSUiNDjQ9e3ziMbZSQzekwmF6+7H6yxMCEa6k8QpeV/JHOBFQEQCR0Yw/E+ApuZ9MluUGn/XC20E72QUWW8jejXuTtmF4P0O75P+AmY8UIp3nRQK+hXO/R4hTiw3Bg1XZBbGziLs+sSHy/E+aXNGrAC8fyIUanpev+qsAhDmNNuj8eUP4LzVlx0lbTUvO1QX0SCbQJDJKMg2cGLQi/dp5FBVRIOA7GlbdThm7n5ak+ADwHTpoQRXj1PQYtYDF3hfyc4NBE4PmCB8i5lK9MAJAODhrocQDFJ7gFBUEAwAwPC6j0LGz9UxswNg2HAls0yD7AIA885MF9GIgUABkKKFW4+Fg8AFFKJHvjszlSCQee0bALNbuG9kGwQ9toD3Qtf1uxVECUYA7+bveujAjVsAgMKvmVNkQizBY94nFWmCEmzzsyCj6EWimFUAvI//tkcj0eyeaevS5QV1RKIn788zCu65JEiBP+/htPTgNigcFt4b8D5xxrLBCi/wvlUo2H48P7sEIgHvmXmfyQyS/ZnCwEYtM4v0vM9EDhqPZgklIZQCs3etIjXvM3mqxSyD3eH9smqGqRpHg647JRKHl3asdqdJGt5P3w8hE4IyZkwyzRi6CQW8j/MX13zyNCDpM/YApryrgYOKACajgPdR5jVzOvcAvCc76yHILes0CB28l33N3JFUYRPEosuYZ1HHEk6DSGDLfWOdBR1MOA0igU33jnEWczQN7vZEJOB9O+/rF18cBEOKG7gQCHh/2nDlJBgyFq3AJi2XIiV5X0lbTYXjIBDwfo/3lcg4FXZgApu0LHam512m7a+it7+sTQJhzPd8xD8l+AOiZwVZIQAAAABJRU5ErkJggg==">
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {

<script>
const W=480,H=800;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let photoImg=null;
let photoDataUrl='';
const logoImg=document.getElementById('logoImg');

// The device serves this page stateless, so remember the form in the browser.
// Text fields are stored as-is; the photo is stored as a downscaled JPEG data
// URL so it fits comfortably in localStorage.
const LS_KEY='crosspoint.badge.form.v1';
function saveForm(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      name:document.getElementById('name').value,
      title:document.getElementById('title').value,
      layout:document.getElementById('layout').value,
      showPhoto:document.getElementById('showPhoto').checked,
      headMain:document.getElementById('headMain').value,
      headSub:document.getElementById('headSub').value,
      agentId:document.getElementById('agentId').value,
      division:document.getElementById('division').value,
      clearance:document.getElementById('clearance').value,
      codeType:document.getElementById('codeType').value,
      codeValue:document.getElementById('codeValue').value,
      ditherCell:document.getElementById('ditherCell').value,
      photo:photoDataUrl
    }));
  }catch(e){}
}
function loadForm(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  if(d){
    if(d.name) document.getElementById('name').value=d.name;
    if(d.title) document.getElementById('title').value=d.title;
    if(d.layout){ document.getElementById('layout').value=d.layout; syncLayoutFields(); }
    if(d.showPhoto!==undefined) document.getElementById('showPhoto').checked=!!d.showPhoto;
    if(d.headMain) document.getElementById('headMain').value=d.headMain;
    if(d.headSub) document.getElementById('headSub').value=d.headSub;
    if(d.agentId) document.getElementById('agentId').value=d.agentId;
    if(d.division) document.getElementById('division').value=d.division;
    if(d.clearance) document.getElementById('clearance').value=d.clearance;
    if(d.codeType) document.getElementById('codeType').value=d.codeType;
    if(d.codeValue) document.getElementById('codeValue').value=d.codeValue;
    if(d.ditherCell) document.getElementById('ditherCell').value=d.ditherCell;
    if(d.photo){
      photoDataUrl=d.photo;
      const im=new Image(); im.onload=()=>{photoImg=im;render();}; im.src=d.photo;
    }
  }
  render();
}
// 600px is plenty for the 360px photo slot and keeps the stored copy small.
function shrinkToDataUrl(img){
  const c=document.createElement('canvas');
  const s=Math.min(1,600/Math.max(img.width,img.height));
  c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.72);
}
document.getElementById('photo').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const im=new Image();
  im.onload=()=>{ photoImg=im; try{ photoDataUrl=shrinkToDataUrl(im); }catch(err){ photoDataUrl=''; } saveForm(); render(); };
  im.src=URL.createObjectURL(f);
};
document.getElementById('render').onclick=render;
document.getElementById('save').onclick=save;
document.getElementById('name').oninput=()=>{saveForm();render();};
document.getElementById('title').oninput=()=>{saveForm();render();};
document.getElementById('codeType').onchange=()=>{saveForm();render();};
document.getElementById('codeValue').oninput=()=>{saveForm();render();};
document.getElementById('ditherCell').onchange=()=>{saveForm();render();};
document.getElementById('layout').onchange=()=>{saveForm();syncLayoutFields();render();};

for(const id of ['headMain','headSub','agentId','division','clearance']) document.getElementById(id).oninput=()=>{saveForm();render();};
function syncLayoutFields(){document.getElementById('badgeOnly').style.display=document.getElementById('layout').value==='badge'?'block':'none';}

// Code 39 narrow/wide encodings. Mobile barcodes use '/' followed by seven
// uppercase alphanumeric characters; the numeric patterns are the standard
// 15-module Code 39 symbol encodings (one bits are black modules).
const CODE39_CHARS='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%*';
const CODE39_PATTERNS=[20957,29783,23639,30485,20951,29813,23669,20855,29789,23645,
  29975,23831,30533,22295,30149,24005,21623,29981,23837,22301,30023,23879,30545,
  22343,30161,24017,21959,30065,23921,22385,29015,18263,29141,17879,29045,18293,
  17783,29021,18269,17477,17489,17681,20753,35770];

function render(){
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  if(document.getElementById('layout').value==='badge'){ renderBadgeLayout(); return; }

  // --- photo (middle): the ONLY dithered element ---
  // Layout depends on what goes at the bottom: a square QR wants more height, so
  // the photo (and everything below it) shifts up in that mode.
  const codeType=document.getElementById('codeType').value;
  const qrMode = codeType==='qr';
  const px=60, py=qrMode?140:170, pw=W-120, ph=qrMode?270:340;
  if(photoImg && document.getElementById('showPhoto').checked){
    drawCover(photoImg,px,py,pw,ph,14);
    // Dither the photo alone, so its midtones survive on a 1-bit panel.
    // Everything drawn afterwards (logo, name, title, barcode) stays solid
    // black: dithering glyph strokes turns them into a speckled, half-missing
    // pattern — the "chipped paint" look.
    ditherRegion(px,py,pw,ph,parseInt(document.getElementById('ditherCell').value||'1',10));
  } else {
    ctx.strokeStyle='#bbb'; ctx.lineWidth=2; ctx.strokeRect(px,py,pw,ph);
    ctx.fillStyle='#bbb'; ctx.font='500 22px sans-serif'; ctx.textAlign='center'; ctx.fillText('尚未上傳照片',W/2,py+ph/2);
  }

  // --- logo (top, centered) — solid ---
  if(logoImg.complete && logoImg.naturalWidth){
    const lw=300, lh=Math.round(logoImg.naturalHeight*lw/logoImg.naturalWidth);
    const lx=(W-lw)/2, ly=40;
    ctx.drawImage(logoImg,lx,ly,lw,lh);
  }

  // --- name / title — solid ---
  const name=(document.getElementById('name').value||'').trim();
  const title=(document.getElementById('title').value||'').trim();
  const codeValue=(document.getElementById('codeValue').value||'').trim();
  ctx.fillStyle='#000'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const nameY = qrMode?490:585, titleY = qrMode?537:632;
  drawFit(name||' ', W/2, nameY, W-60, 62, '700');
  ctx.fillStyle='#000';
  drawFit(title||' ', W/2, titleY, W-80, 32, '500');

  // --- machine-readable code: as large as the band allows, no caption ---
  const status=document.getElementById('carrierStatus');
  const bandY=qrMode?560:648, bandH=qrMode?225:142;
  if(codeType==='none' || !codeValue){
    status.textContent = codeType==='none' ? '不顯示條碼。' : '填入內容才會顯示條碼／QR Code。';
  }else if(codeType==='barcode'){
    const v=codeValue.toUpperCase();
    if(!/^\/[A-Z0-9]{7}$/.test(v) && !/^[0-9A-Z.\- $/+%]+$/.test(v)){
      status.textContent='一維碼只支援 0-9 A-Z 與 - . 空白 $ / + %，例如 /SM6OLEQ。';
    }else{
      status.textContent='一維碼預覽：'+v;
      drawCode39(v, 24, bandY, W-48, bandH);
    }
  }else{ // qr
    status.textContent='QR Code 預覽：'+codeValue;
    drawQr(codeValue, (W-bandH)/2, bandY, bandH);
  }

  // Final pass: force every remaining colour to pure black/white by luminance.
  solidifyRegion(0,0,W,H,200);
}

function drawQr(text,x,y,size){
  const qr=qrcode(0,'M');
  qr.addData(text);
  qr.make();
  const n=qr.getModuleCount();
  const scale=Math.max(1,Math.floor(size/n));
  const px=n*scale;
  const ox=x+Math.floor((size-px)/2), oy=y+Math.floor((size-px)/2);
  ctx.fillStyle='#fff'; ctx.fillRect(ox-4,oy-4,px+8,px+8);   // quiet zone
  ctx.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect(ox+c*scale,oy+r*scale,scale,scale);
}

function drawCode39(value,x,y,maxWidth,height){
  const symbols='*'+value+'*';
  const patterns=[];
  for(const ch of symbols){
    const index=CODE39_CHARS.indexOf(ch);
    if(index<0) throw new Error('Unsupported Code 39 character: '+ch);
    // Match JsBarcode's standard Code 39 encoding: the integer's binary string
    // is the exact run-length module sequence (the '*' start/stop is 16 bits).
    patterns.push(CODE39_PATTERNS[index].toString(2));
  }
  const patternModules=patterns.reduce((sum,pattern)=>sum+pattern.length,0);
  const totalModules=patternModules+(patterns.length-1)+20; // 10-module quiet zones
  const module=Math.min(3,Math.floor(maxWidth/totalModules));
  if(module<1) throw new Error('Carrier barcode does not fit');
  const totalWidth=totalModules*module;
  let cursor=x+Math.floor((maxWidth-totalWidth)/2)+10*module;
  ctx.fillStyle='#000';
  for(let c=0;c<patterns.length;c++){
    const pattern=patterns[c];
    for(let i=0;i<pattern.length;i++){
      if(pattern[i]==='1') ctx.fillRect(cursor,y,module,height);
      cursor+=module;
    }
    if(c<patterns.length-1) cursor+=module; // inter-character gap
  }
}

function drawCover(img,x,y,w,h,r){
  const ir=img.width/img.height, R=w/h; let dw,dh,dx,dy;
  if(ir>R){ dh=h; dw=h*ir; dx=x-(dw-w)/2; dy=y; } else { dw=w; dh=w/ir; dx=x; dy=y-(dh-h)/2; }
  ctx.save(); roundRect(x,y,w,h,r); ctx.clip(); ctx.drawImage(img,dx,dy,dw,dh); ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawFit(text,x,y,maxW,maxH,weight,mode){
  let size=maxH; do{ctx.font=weight+' '+size+'px "PingFang TC","Noto Sans TC",sans-serif'; if(ctx.measureText(text).width<=maxW)break; size-=2;}while(size>12);
  const prevAlign=ctx.textAlign;
  if(mode) ctx.textAlign=mode;
  // Only a hairline stroke, and only at small sizes where a 1px stem can drop
  // out. No fattening at display sizes: outlining a CJK glyph bloats it into a
  // blob, and the reference badge proves thin strokes reproduce fine here.
  if(size<20){
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.lineWidth=1; ctx.strokeStyle=ctx.fillStyle;
    ctx.strokeText(text,x,y);
  }
  ctx.fillText(text,x,y);
  ctx.textAlign=prevAlign;
}

// Force one rectangle to pure black/white by luminance (no error diffusion).
// Used for the colour logo: makeBmp() classifies each pixel by its red channel
// alone, so anything not turned into pure black here would be written as white
// and the logo would vanish from the panel image.
function solidifyRegion(rx,ry,rw,rh,threshold){
  const x0=Math.max(0,Math.floor(rx)), y0=Math.max(0,Math.floor(ry));
  const x1=Math.min(W,Math.ceil(rx+rw)), y1=Math.min(H,Math.ceil(ry+rh));
  const iw=x1-x0, ih=y1-y0;
  if(iw<=0||ih<=0) return;
  const img=ctx.getImageData(x0,y0,iw,ih), d=img.data;
  for(let p=0;p<iw*ih;p++){
    const i=p*4;
    const lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const v=lum<threshold?0:255;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,x0,y0);
}

// Grayscale + Floyd–Steinberg to 1-bit, limited to one rectangle.
// Only the photo is passed through this; text and logo must stay solid.
// 4x4 Bayer ordered dither, limited to one rectangle. A REGULAR pattern reads
// far cleaner on this e-ink panel than Floyd-Steinberg's aperiodic noise, which
// shows up as mush. Contrast is lifted a little first so the result keeps its
// punch instead of turning uniformly grey.
const BAYER4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function ditherRegion(rx,ry,rw,rh,cell){
  cell=Math.max(1,cell||1);
  const x0=Math.max(0,Math.floor(rx)), y0=Math.max(0,Math.floor(ry));
  const x1=Math.min(W,Math.ceil(rx+rw)), y1=Math.min(H,Math.ceil(ry+rh));
  const iw=x1-x0, ih=y1-y0;
  if(iw<=0||ih<=0) return;
  const img=ctx.getImageData(x0,y0,iw,ih), d=img.data;
  // Ordered dither where each Bayer cell covers `cell` x `cell` real pixels.
  // At cell=1 this is a classic 4x4 Bayer screen; raising it makes the dots
  // physically larger so the panel can resolve them (a 1px dot pattern can
  // read as uneven mush on this EPD). The whole block is set to one value, so
  // the apparent tone is unchanged while the texture gets coarser.
  for(let cy=0;cy<ih;cy+=cell){
    for(let cx=0;cx<iw;cx+=cell){
      let sum=0, n=0;
      const ey=Math.min(cy+cell,ih), ex=Math.min(cx+cell,iw);
      for(let y=cy;y<ey;y++){
        for(let x=cx;x<ex;x++){
          const i=(y*iw+x)*4;
          sum+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; n++;
        }
      }
      let lum=sum/n;
      lum=(lum-128)*1.35+138;                       // contrast + slight lift
      if(lum<0) lum=0; if(lum>255) lum=255;
      const bx=Math.floor(cx/cell)&3, by=Math.floor(cy/cell)&3;
      const threshold=(BAYER4[by][bx]+0.5)*255/16;
      const v=lum>threshold?255:0;
      for(let y=cy;y<ey;y++){
        for(let x=cx;x<ex;x++){
          const i=(y*iw+x)*4; d[i]=d[i+1]=d[i+2]=v;
        }
      }
    }
  }
  ctx.putImageData(img,x0,y0);
}


// ===========================================================================
// "工牌" layout, modelled on the community badge the customer supplied:
// black title band with the logo reversed out, a rule-separated meta row, a
// huge name, title, wide-tracked division, a clearance row, the code with
// corner brackets, and a 45-degree hatched footer. Everything is pure black or
// white with >=2px strokes, because that is what this 1-bit panel reproduces
// cleanly (a dithered photo is the only element that cannot).
// ===========================================================================
function renderBadgeLayout(){
  const g=id=>document.getElementById(id);
  const name=(g('name').value||'').trim();
  const title=(g('title').value||'').trim();
  const agentId=(g('agentId').value||'').trim();
  const division=(g('division').value||'').trim();
  const clearance=(g('clearance').value||'').trim();
  const codeType=g('codeType').value;
  const codeValue=(g('codeValue').value||'').trim();
  const showPhoto=g('showPhoto').checked;
  const status=g('carrierStatus');
  const CJK='"PingFang TC","Noto Sans TC",sans-serif';

  // Every coordinate below was measured off the reference badge BMP the
  // customer supplied, so this reproduces that layout rather than approximating
  // it. Content box is x 28..452 (M = 28) throughout.
  const M=28, RW=W-2*M;

  // --- black title band, y 0..149 ---------------------------------------
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,150);
  const headMain=(g('headMain').value||'').trim();
  const headSub=(g('headSub').value||'').trim();
  if(headMain){
    // Own header: large left-aligned wordmark of the user's choosing, so the
    // layout borrows the reference's structure without copying its identity.
    ctx.fillStyle='#fff';
    drawFit(headMain, M, 108, RW, 64, '700', 'left');
  }else if(logoImg.complete&&logoImg.naturalWidth){
    // Exact box measured off the reference badge: the mark sits at x 28,
    // y 25 and is 266x72. The embedded logo IS that mark, lifted from the
    // reference BMP, so the company mark matches it pixel for pixel.
    // The embedded mark is black-on-transparent, so paint it onto a WHITE
    // patch first and invert the whole patch: the mark turns white and the
    // patch turns black, which is exactly the reference's reversed-out look.
    ctx.fillStyle='#fff'; ctx.fillRect(M, 25, 266, 72);
    ctx.drawImage(logoImg, M, 25, 266, 72);
    reverseInPlace(M, 25, 266, 72);
  }
  ctx.fillStyle='#fff';
  ctx.font='700 12px '+CJK; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  drawTracked(headSub||'STAFF IDENTIFICATION', M, 138, 2, 'left');

  // --- meta row (text 164..175) + rule at y 190 -------------------------
  ctx.fillStyle='#000';
  ctx.font='700 14px '+CJK; ctx.textAlign='left';
  if(agentId) ctx.fillText('EMPLOYEE ID  '+agentId, M, 175);
  ctx.textAlign='right'; ctx.fillText('ACTIVE', W-M, 175);
  ctx.fillRect(M,190,RW,2);

  // --- name (209..337) / title (368..393) / division (413..421) ---------
  ctx.fillStyle='#000'; ctx.textAlign='center';
  // Big by default: allow it almost the full panel width and a taller cap
  // height than the reference, which lets a short (CJK) name really fill the
  // band; a long Latin name is still width-limited and just scales down.
  drawFit(name||' ', W/2, 352, W-16, 140, '700');
  // The job title lives in the black chip lower down, not here, so a long title
  // cannot fight the name for width.
  if(division){
    ctx.fillStyle='#000'; ctx.font='500 12px '+CJK;
    ctx.textAlign='center'; drawTracked(division, W/2, 393, 4.5, 'center');
  }

  // --- clearance row: rule 443, chip x 324..452 y 456..496, rule 507 ----
  ctx.fillStyle='#000';
  ctx.fillRect(M,443,RW,2);
  ctx.font='600 14px '+CJK; ctx.textAlign='left';
  ctx.fillText('TITLE', M, 481);
  // Black chip on the right, sized to the title so it always ends flush with the
  // content box, exactly where the reference puts its LEVEL badge.
  const chipY=456, chipH=40;
  let chipFont=18;
  const chipText=title||'—';
  do{ ctx.font='600 '+chipFont+'px '+CJK; if(ctx.measureText(chipText).width<=RW-150)break; chipFont-=1; }while(chipFont>10);
  const chipW=Math.max(128, Math.min(RW-120, Math.ceil(ctx.measureText(chipText).width)+28));
  const chipX=W-M-chipW;
  ctx.fillRect(chipX,chipY,chipW,chipH);
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText(chipText, chipX+chipW/2, chipY+27);
  ctx.fillStyle='#000';
  ctx.fillRect(M,507,RW,2);

  // --- bottom band, x 129..350 y 523..744 (the reference bracket box) ---
  const bx=129, by=523, bs=222;
  if(showPhoto && photoImg){
    drawCover(photoImg, bx, by, bs, bs, 10);
    ditherRegion(bx, by, bs, bs, parseInt(g('ditherCell').value||'2',10));
    status.textContent='照片顯示中（取代條碼區）。';
  }else if(codeType==='none'||!codeValue){
    status.textContent = codeType==='none' ? '不顯示條碼。' : '填入內容才會顯示條碼／QR Code。';
  }else if(codeType==='barcode'){
    const v=codeValue.toUpperCase();
    if(!/^\/[A-Z0-9]{7}$/.test(v) && !/^[0-9A-Z.\- $/+%]+$/.test(v)){
      status.textContent='一維碼只支援 0-9 A-Z 與 - . 空白 $ / + %，例如 /SM6OLEQ。';
    }else{
      status.textContent='一維碼預覽：'+v;
      // A 1D symbol is wide and short: give it the whole content width and a
      // tall bar height, not the square QR box (which collapsed every bar to
      // a single pixel). Vertically centred in the code band.
      drawCode39(v, M, 556, RW, 176);
    }
  }else{
    status.textContent='QR Code 預覽：'+codeValue;
    drawQr(codeValue, bx+11, by+11, bs-22);
    drawQrBrackets(bx, by, bs);
  }

  // --- payload caption (752..765) and hatched footer (784..799) ---------
  if(codeValue && !(showPhoto&&photoImg)){
    ctx.fillStyle='#000'; ctx.font='700 13px '+CJK; ctx.textAlign='center';
    ctx.fillText(codeValue, W/2, 763);
  }
  const FOOT=16, top=H-FOOT, step=10;
  ctx.fillStyle='#fff'; ctx.fillRect(0,top,W,FOOT);
  ctx.fillStyle='#000';
  for(let x=-FOOT;x<W+FOOT;x+=step*2){
    ctx.beginPath();
    ctx.moveTo(x,top); ctx.lineTo(x+step,top);
    ctx.lineTo(x+step-FOOT,top+FOOT); ctx.lineTo(x-FOOT,top+FOOT);
    ctx.closePath(); ctx.fill();
  }
  solidifyRegion(0,0,W,H,200);
}

// Reverse the pixels of one rectangle in place: dark -> white, everything else
// -> black. Used to draw the logo reversed out of the black title band, which
// is what the reference achieves with `filter: brightness(0) invert(1)`.
function reverseInPlace(rx,ry,rw,rh){
  const x0=Math.max(0,Math.floor(rx)), y0=Math.max(0,Math.floor(ry));
  const x1=Math.min(W,Math.ceil(rx+rw)), y1=Math.min(H,Math.ceil(ry+rh));
  const iw=x1-x0, ih=y1-y0;
  if(iw<=0||ih<=0) return;
  const img=ctx.getImageData(x0,y0,iw,ih), d=img.data;
  for(let p=0;p<iw*ih;p++){
    const i=p*4;
    const lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const v=lum<128?255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,x0,y0);
}

// Draw text with extra tracking (the reference's letter-spacing). mode 'center'
// centres on cx, 'left' starts at cx.
function drawTracked(text,cx,baseY,spacing,mode){
  let w=0;
  for(const ch of text) w+=ctx.measureText(ch).width+spacing;
  w-=spacing;
  let x = (mode==='left') ? cx : cx-w/2;
  const prev=ctx.textAlign; ctx.textAlign='left';
  for(const ch of text){ ctx.fillText(ch,x,baseY); x+=ctx.measureText(ch).width+spacing; }
  ctx.textAlign=prev;
}

// Four corner brackets around the QR, as the reference draws them.
function drawQrBrackets(x,y,size){
  const L=26, T=5;
  ctx.fillStyle='#000';
  ctx.fillRect(x,y,L,T);            ctx.fillRect(x,y,T,L);
  ctx.fillRect(x+size-L,y,L,T);     ctx.fillRect(x+size-T,y,T,L);
  ctx.fillRect(x,y+size-T,L,T);     ctx.fillRect(x,y+size-T,T,L);
  ctx.fillRect(x+size-L,y+size-T,L,T); ctx.fillRect(x+size-T,y+size-T,T,L);
}

// 10px black / 10px white at 45 degrees, filling the last FOOT px of the panel.
function hatchFooter(){
  const FOOT=16, top=H-FOOT, step=10;
  ctx.fillStyle='#fff'; ctx.fillRect(0,top,W,FOOT);
  ctx.fillStyle='#000';
  for(let x=-FOOT;x<W+FOOT;x+=step*2){
    ctx.beginPath();
    ctx.moveTo(x,top); ctx.lineTo(x+step,top);
    ctx.lineTo(x+step-FOOT,top+FOOT); ctx.lineTo(x-FOOT,top+FOOT);
    ctx.closePath(); ctx.fill();
  }
}

function makeBmp(){
  const rowBytes=60; // 480 px / 8 = 60, already 4-byte aligned
  const dataSize=rowBytes*H, fileSize=14+40+8+dataSize;
  const buf=new ArrayBuffer(fileSize), dv=new DataView(buf), u8=new Uint8Array(buf);
  dv.setUint16(0,0x4D42,true); dv.setUint32(2,fileSize,true); dv.setUint32(10,62,true);
  dv.setUint32(14,40,true); dv.setInt32(18,W,true); dv.setInt32(22,H,true);
  dv.setUint16(26,1,true); dv.setUint16(28,1,true); dv.setUint32(30,0,true); dv.setUint32(34,dataSize,true);
  dv.setUint32(38,2835,true); dv.setUint32(42,2835,true); dv.setUint32(46,2,true); dv.setUint32(50,2,true);
  u8[54]=0;u8[55]=0;u8[56]=0;u8[57]=0; u8[58]=255;u8[59]=255;u8[60]=255;u8[61]=0; // 0=black,1=white
  const img=ctx.getImageData(0,0,W,H).data;
  let p=62;
  for(let row=H-1;row>=0;row--){            // BMP is bottom-up
    for(let bx=0;bx<rowBytes;bx++){
      let byte=0;
      for(let b=0;b<8;b++){ const x=bx*8+b; const i=(row*W+x)*4; const bit=img[i]<128?0:1; byte|=(bit<<(7-b)); }
      u8[p++]=byte;
    }
  }
  return new Blob([buf],{type:'image/bmp'});
}

async function save(){
  render();
  const fd=new FormData();
  fd.append('file', makeBmp(), 'badge.bmp');
  setStatus('上傳中…');
  try{
    const r=await fetch('/upload?path=/.crosspoint',{method:'POST',body:fd});
    if(!r.ok) throw new Error(await r.text());
    setStatus('已存到 /.crosspoint/badge.bmp ✔ 到裝置設定選「名牌」即可。');
  }catch(e){ setStatus('上傳失敗：'+e.message); }
}
function setStatus(t){document.getElementById('status').textContent=t;}

logoImg.onload=render;
logoImg.onerror=render;
// Restore the remembered form only now that every declaration above has been
// evaluated. loadForm() renders, and render() reaches drawCode39(), which reads
// the `const CODE39_CHARS` tables declared above this line; calling it earlier
// threw a TDZ ReferenceError that silently killed both the preview and save().
loadForm();
if(logoImg.complete) render(); else render();
</script>
