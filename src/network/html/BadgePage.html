<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>名牌製作</title>
<style>
:root{color-scheme:light;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:#1F2937;background:#FFFBF7}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid #E7DDD0;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
h3{margin:0;font-size:18px}
label{display:block;font-size:14px;color:#374151}
input[type=file],input[type=text]{font:inherit;font-size:16px;border:1px solid #E7DDD0;border-radius:10px;padding:8px 12px;background:#FFF7ED;color:#1F2937;width:100%}
button{font:inherit;font-size:16px;border:1px solid #E7DDD0;border-radius:10px;padding:9px 14px;background:#FFF7ED;color:#1F2937;cursor:pointer}
button.primary{background:#F97316;border-color:#F97316;color:#111;font-weight:700}
canvas{width:auto;max-width:100%;border:1px solid #E7DDD0;border-radius:8px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.preview{display:flex;justify-content:center}
.small{font-size:13px;color:#6B7280;margin:0}
#status:empty{display:none}
</style>
<div class="wrap">
  <div class="card"><h3>名牌製作（直向 480×800）</h3>
    <p class="small">上傳照片、填姓名／職稱與載具號碼；版面：公司 logo → 照片 → 名字 → 條碼。存到裝置後設成待機「名牌」。</p></div>
  <div class="card">
    <label>照片 <input type="file" id="photo" accept="image/*"></label>
    <label>姓名 <input type="text" id="name" maxlength="12" placeholder="你的名字"></label>
    <label>職稱 <input type="text" id="title" maxlength="20" placeholder="職稱"></label>
    <label>排版 <select id="layout" style="font:inherit;font-size:16px;padding:8px 12px;border:1px solid #E7DDD0;border-radius:10px;background:#FFF7ED;width:100%">
      <option value="classic">經典（照片在上、大字在下）</option>
      <option value="badge">工牌（同事版：黑底標題列＋大名字＋QR）</option>
    </select></label>
    <div id="badgeOnly" style="display:none">
      <label>員工編號 <input type="text" id="agentId" maxlength="20" placeholder="SR-D9AC" spellcheck="false"></label>
      <label>部門／標語 <input type="text" id="division" maxlength="40" placeholder="SCIENCE &amp; TECHNOLOGY DIVISION" spellcheck="false"></label>
      <label>權限等級 <input type="text" id="clearance" maxlength="6" placeholder="7" spellcheck="false"></label>
    </div>
    <label>條碼類型 <select id="codeType" style="font:inherit;font-size:16px;padding:8px 12px;border:1px solid #E7DDD0;border-radius:10px;background:#FFF7ED;width:100%">
      <option value="barcode">一維碼（Code 39）</option>
      <option value="qr">QR Code</option>
      <option value="none">不顯示</option>
    </select></label>
    <label>內容（載具號碼或網址） <input type="text" id="codeValue" maxlength="120" placeholder="/SM6OLEQ 或 https://…" spellcheck="false"></label>
    <label>照片抖色顆粒 <select id="ditherCell" style="font:inherit;font-size:16px;padding:8px 12px;border:1px solid #E7DDD0;border-radius:10px;background:#FFF7ED;width:100%">
      <option value="1">細 1px（不建議，這片面板會糊）</option>
      <option value="2" selected>中 2px（建議起點）</option>
      <option value="3">粗 3px（面板最吃得下）</option>
    </select></label>
    <p id="carrierStatus" class="small">一維碼請填 / 開頭 8 碼載具號；QR Code 可填任意網址或文字。</p>
  </div>
  <div class="card">
    <div class="preview"><canvas id="cv" width="480" height="800"></canvas></div>
    <div class="row"><button id="render">重新預覽</button><button id="save" class="primary">存到裝置（待機名牌）</button></div>
    <p class="small">存檔位置：<b>/.crosspoint/badge.bmp</b>；裝置端：<b>設定 → 顯示 → 休眠屏幕 → 名牌</b>。</p>
    <p id="status" class="small"></p>
  </div>
</div>

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

          for (var col = 0; col < moduleCount; col += 1) {

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      }

      if (_dataCache == null) {

    var setupPositionProbePattern = function(row, col) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              } else {
                _modules[row + r][col + c] = false;
              }
            }

        }
      }

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }

      _modules[_moduleCount - 8][8] = (!test);

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;

              var mask = maskFunc(row, col - c);

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {

                bitIndex = 7;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        for (var i = 0; i < ecdata[r].length; i += 1) {

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }

      return data;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

<script>
const W=480,H=800;

// The device serves this page stateless, so remember the form in the browser.

const LS_KEY='crosspoint.badge.form.v1';
function saveForm(){

    }));
  }catch(e){}
}
function loadForm(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  if(d){
    if(d.name) document.getElementById('name').value=d.name;
    if(d.title) document.getElementById('title').value=d.title;
    if(d.layout){ document.getElementById('layout').value=d.layout; syncLayoutFields(); }
    if(d.agentId) document.getElementById('agentId').value=d.agentId;
    if(d.division) document.getElementById('division').value=d.division;
    if(d.clearance) document.getElementById('clearance').value=d.clearance;
    if(d.codeType) document.getElementById('codeType').value=d.codeType;
    if(d.codeValue) document.getElementById('codeValue').value=d.codeValue;
    if(d.ditherCell) document.getElementById('ditherCell').value=d.ditherCell;
    if(d.photo){

// 600px is plenty for the 360px photo slot and keeps the stored copy small.
function shrinkToDataUrl(img){
  const c=document.createElement('canvas');
  const s=Math.min(1,600/Math.max(img.width,img.height));
  c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s));
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.72);
}
document.getElementById('photo').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;

document.getElementById('render').onclick=render;

document.getElementById('name').oninput=()=>{saveForm();render();};
document.getElementById('title').oninput=()=>{saveForm();render();};

function syncLayoutFields(){document.getElementById('badgeOnly').style.display=document.getElementById('layout').value==='badge'?'block':'none';}

// Code 39 narrow/wide encodings. Mobile barcodes use '/' followed by seven
// uppercase alphanumeric characters; the numeric patterns are the standard
// 15-module Code 39 symbol encodings (one bits are black modules).
const CODE39_CHARS='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%*';
const CODE39_PATTERNS=[20957,29783,23639,30485,20951,29813,23669,20855,29789,23645,
  29975,23831,30533,22295,30149,24005,21623,29981,23837,22301,30023,23879,30545,
  22343,30161,24017,21959,30065,23921,22385,29015,18263,29141,17879,29045,18293,
  17783,29021,18269,17477,17489,17681,20753,35770];

function render(){
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  if(document.getElementById('layout').value==='badge'){ renderBadgeLayout(); return; }

  // --- photo (middle): the ONLY dithered element ---
  // Layout depends on what goes at the bottom: a square QR wants more height, so
  // the photo (and everything below it) shifts up in that mode.
  const codeType=document.getElementById('codeType').value;
  const qrMode = codeType==='qr';
  const px=60, py=qrMode?140:170, pw=W-120, ph=qrMode?270:340;
  if(photoImg){
    drawCover(photoImg,px,py,pw,ph,14);
    // Dither the photo alone, so its midtones survive on a 1-bit panel.
    // Everything drawn afterwards (logo, name, title, barcode) stays solid
    // black: dithering glyph strokes turns them into a speckled, half-missing
    // pattern — the "chipped paint" look.
    ditherRegion(px,py,pw,ph,parseInt(document.getElementById('ditherCell').value||'1',10));
  } else {
    ctx.strokeStyle='#bbb'; ctx.lineWidth=2; ctx.strokeRect(px,py,pw,ph);
    ctx.fillStyle='#bbb'; ctx.font='500 22px sans-serif'; ctx.textAlign='center'; ctx.fillText('尚未上傳照片',W/2,py+ph/2);
  }

  // --- logo (top, centered) — solid ---
  if(logoImg.complete && logoImg.naturalWidth){
    const lw=300, lh=Math.round(logoImg.naturalHeight*lw/logoImg.naturalWidth);
    const lx=(W-lw)/2, ly=40;
    ctx.drawImage(logoImg,lx,ly,lw,lh);
  }

  // --- name / title — solid ---
  const name=(document.getElementById('name').value||'').trim();
  const title=(document.getElementById('title').value||'').trim();
  const codeValue=(document.getElementById('codeValue').value||'').trim();
  ctx.fillStyle='#000'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const nameY = qrMode?490:585, titleY = qrMode?537:632;
  drawFit(name||' ', W/2, nameY, W-60, 62, '700');
  ctx.fillStyle='#000';
  drawFit(title||' ', W/2, titleY, W-80, 32, '500');

  // --- machine-readable code: as large as the band allows, no caption ---
  const status=document.getElementById('carrierStatus');
  const bandY=qrMode?560:648, bandH=qrMode?225:142;
  if(codeType==='none' || !codeValue){
    status.textContent = codeType==='none' ? '不顯示條碼。' : '填入內容才會顯示條碼／QR Code。';
  }else if(codeType==='barcode'){
    const v=codeValue.toUpperCase();
    if(!/^\/[A-Z0-9]{7}$/.test(v) && !/^[0-9A-Z.\- $/+%]+$/.test(v)){
      status.textContent='一維碼只支援 0-9 A-Z 與 - . 空白 $ / + %，例如 /SM6OLEQ。';
    }else{
      status.textContent='一維碼預覽：'+v;
      drawCode39(v, 24, bandY, W-48, bandH);
    }
  }else{ // qr
    status.textContent='QR Code 預覽：'+codeValue;
    drawQr(codeValue, (W-bandH)/2, bandY, bandH);
  }

  // Final pass: force every remaining colour to pure black/white by luminance.
  solidifyRegion(0,0,W,H,200);
}

function drawQr(text,x,y,size){
  const qr=qrcode(0,'M');
  qr.addData(text);
  qr.make();
  const n=qr.getModuleCount();
  const scale=Math.max(1,Math.floor(size/n));
  const px=n*scale;
  const ox=x+Math.floor((size-px)/2), oy=y+Math.floor((size-px)/2);
  ctx.fillStyle='#fff'; ctx.fillRect(ox-4,oy-4,px+8,px+8);   // quiet zone
  ctx.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect(ox+c*scale,oy+r*scale,scale,scale);
}

function drawCode39(value,x,y,maxWidth,height){
  const symbols='*'+value+'*';
  const patterns=[];
  for(const ch of symbols){
    const index=CODE39_CHARS.indexOf(ch);
    if(index<0) throw new Error('Unsupported Code 39 character: '+ch);
    // Match JsBarcode's standard Code 39 encoding: the integer's binary string
    // is the exact run-length module sequence (the '*' start/stop is 16 bits).
    patterns.push(CODE39_PATTERNS[index].toString(2));
  }
  const patternModules=patterns.reduce((sum,pattern)=>sum+pattern.length,0);
  const totalModules=patternModules+(patterns.length-1)+20; // 10-module quiet zones
  const module=Math.min(3,Math.floor(maxWidth/totalModules));
  if(module<1) throw new Error('Carrier barcode does not fit');
  const totalWidth=totalModules*module;
  let cursor=x+Math.floor((maxWidth-totalWidth)/2)+10*module;
  ctx.fillStyle='#000';
  for(let c=0;c<patterns.length;c++){
    const pattern=patterns[c];
    for(let i=0;i<pattern.length;i++){
      if(pattern[i]==='1') ctx.fillRect(cursor,y,module,height);
      cursor+=module;
    }
    if(c<patterns.length-1) cursor+=module; // inter-character gap
  }
}

function drawCover(img,x,y,w,h,r){
  const ir=img.width/img.height, R=w/h; let dw,dh,dx,dy;
  if(ir>R){ dh=h; dw=h*ir; dx=x-(dw-w)/2; dy=y; } else { dw=w; dh=w/ir; dx=x; dy=y-(dh-h)/2; }
  ctx.save(); roundRect(x,y,w,h,r); ctx.clip(); ctx.drawImage(img,dx,dy,dw,dh); ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawFit(text,x,y,maxW,maxH,weight){
  let size=maxH; do{ctx.font=weight+' '+size+'px "PingFang TC","Noto Sans TC",sans-serif'; if(ctx.measureText(text).width<=maxW)break; size-=2;}while(size>12);
  // Fatten the strokes: on this 1-bit panel thin black-on-white glyph strokes
  // render mottled, so outline the glyph as well as filling it (adds ~2px of
  // weight at these sizes). Kept before the final threshold pass.
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=Math.max(2,Math.round(size*0.05));
  ctx.strokeStyle=ctx.fillStyle;
  ctx.strokeText(text,x,y);
  ctx.fillText(text,x,y);
}

// Force one rectangle to pure black/white by luminance (no error diffusion).
// Used for the colour logo: makeBmp() classifies each pixel by its red channel
// alone, so anything not turned into pure black here would be written as white
// and the logo would vanish from the panel image.
function solidifyRegion(rx,ry,rw,rh,threshold){
  const x0=Math.max(0,Math.floor(rx)), y0=Math.max(0,Math.floor(ry));
  const x1=Math.min(W,Math.ceil(rx+rw)), y1=Math.min(H,Math.ceil(ry+rh));
  const iw=x1-x0, ih=y1-y0;
  if(iw<=0||ih<=0) return;
  const img=ctx.getImageData(x0,y0,iw,ih), d=img.data;
  for(let p=0;p<iw*ih;p++){
    const i=p*4;
    const lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const v=lum<threshold?0:255;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,x0,y0);
}

// Grayscale + Floyd–Steinberg to 1-bit, limited to one rectangle.
// Only the photo is passed through this; text and logo must stay solid.
// 4x4 Bayer ordered dither, limited to one rectangle. A REGULAR pattern reads
// far cleaner on this e-ink panel than Floyd-Steinberg's aperiodic noise, which
// shows up as mush. Contrast is lifted a little first so the result keeps its
// punch instead of turning uniformly grey.
const BAYER4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function ditherRegion(rx,ry,rw,rh,cell){
  cell=Math.max(1,cell||1);
  const x0=Math.max(0,Math.floor(rx)), y0=Math.max(0,Math.floor(ry));
  const x1=Math.min(W,Math.ceil(rx+rw)), y1=Math.min(H,Math.ceil(ry+rh));
  const iw=x1-x0, ih=y1-y0;
  if(iw<=0||ih<=0) return;
  const img=ctx.getImageData(x0,y0,iw,ih), d=img.data;
  // Ordered dither where each Bayer cell covers `cell` x `cell` real pixels.
  // At cell=1 this is a classic 4x4 Bayer screen; raising it makes the dots
  // physically larger so the panel can resolve them (a 1px dot pattern can
  // read as uneven mush on this EPD). The whole block is set to one value, so
  // the apparent tone is unchanged while the texture gets coarser.
  for(let cy=0;cy<ih;cy+=cell){
    for(let cx=0;cx<iw;cx+=cell){
      let sum=0, n=0;
      const ey=Math.min(cy+cell,ih), ex=Math.min(cx+cell,iw);
      for(let y=cy;y<ey;y++){
        for(let x=cx;x<ex;x++){
          const i=(y*iw+x)*4;
          sum+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; n++;
        }
      }
      let lum=sum/n;
      lum=(lum-128)*1.35+138;                       // contrast + slight lift
      if(lum<0) lum=0; if(lum>255) lum=255;
      const bx=Math.floor(cx/cell)&3, by=Math.floor(cy/cell)&3;
      const threshold=(BAYER4[by][bx]+0.5)*255/16;
      const v=lum>threshold?255:0;
      for(let y=cy;y<ey;y++){
        for(let x=cx;x<ex;x++){
          const i=(y*iw+x)*4; d[i]=d[i+1]=d[i+2]=v;
        }
      }
    }
  }
  ctx.putImageData(img,x0,y0);
}


// ===========================================================================
// "工牌" layout, modelled on the community badge the customer supplied:
// black title band with the logo reversed out, a rule-separated meta row, a
// huge name, title, wide-tracked division, a clearance row, the code with
// corner brackets, and a 45-degree hatched footer. Everything is pure black or
// white with >=2px strokes, because that is what this 1-bit panel reproduces
// cleanly (a dithered photo is the only element that cannot).
// ===========================================================================
function renderBadgeLayout(){
  const name=(document.getElementById('name').value||'').trim();
  const title=(document.getElementById('title').value||'').trim();
  const agentId=(document.getElementById('agentId').value||'').trim();
  const division=(document.getElementById('division').value||'').trim();
  const clearance=(document.getElementById('clearance').value||'').trim();
  const codeType=document.getElementById('codeType').value;
  const codeValue=(document.getElementById('codeValue').value||'').trim();
  const ditherCell=parseInt(document.getElementById('ditherCell').value||'1',10);
  const status=document.getElementById('carrierStatus');

  const M=28;                       // side margin, as the reference uses
  let y=0;

  // --- black title band -------------------------------------------------
  const HEAD=150;
  ctx.fillStyle='#000'; ctx.fillRect(0,y,W,HEAD);
  if(logoImg.complete&&logoImg.naturalWidth){
    const lh=64, lw=Math.round(logoImg.naturalWidth*lh/logoImg.naturalHeight);
    const ly=y+30;
    ctx.drawImage(logoImg,M,ly,lw,lh);
    reverseInPlace(M,ly,lw,lh);      // black mark -> white on the black band
  }
  ctx.fillStyle='#fff';
  ctx.font='700 12px "PingFang TC","Noto Sans TC",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('授權人員專用', M, y+HEAD-18);
  y+=HEAD;

  // --- meta row + rule --------------------------------------------------
  ctx.fillStyle='#000';
  ctx.font='700 14px "PingFang TC","Noto Sans TC",sans-serif';
  ctx.textAlign='left';
  if(agentId) ctx.fillText('員工編號  '+agentId, M, y+26);
  ctx.textAlign='right';
  ctx.fillText('ACTIVE', W-M, y+26);
  ctx.fillRect(M, y+42, W-2*M, 2);
  y+=44;

  // --- photo (optional; the reference has none) -------------------------
  if(photoImg){
    const ph=190, pw=W-2*M;
    drawCover(photoImg,M,y+12,pw,ph,10);
    ditherRegion(M,y+12,pw,ph,ditherCell);
    y+=ph+20;
  }

  // --- name / title / division -----------------------------------------
  ctx.fillStyle='#000';
  ctx.textAlign='center';
  const nameBase = y+96;
  drawFit(name||' ', W/2, nameBase, W-2*M, 96, '700');
  ctx.fillStyle='#000';
  drawFit(title||' ', W/2, nameBase+52, W-2*M, 34, '500');
  if(division){
    const prev=ctx.fillStyle;
    ctx.font='500 13px "PingFang TC","Noto Sans TC",sans-serif';
    ctx.textAlign='center';
    drawTracked(division, W/2, nameBase+80, 4);
    ctx.fillStyle=prev;
  }
  y=nameBase+96;

  // --- clearance row ----------------------------------------------------
  ctx.fillStyle='#000';
  ctx.fillRect(M, y, W-2*M, 2);
  const chipW=130, chipY=y+16, chipH=38;
  ctx.font='700 14px "PingFang TC","Noto Sans TC",sans-serif';
  ctx.textAlign='left';
  ctx.fillText('權限等級', M, chipY+26);
  if(clearance){
    ctx.fillRect(W-M-chipW, chipY, chipW, chipH);
    ctx.fillStyle='#fff';
    ctx.font='700 20px "PingFang TC","Noto Sans TC",sans-serif';
    ctx.textAlign='center';
    ctx.fillText(clearance, W-M-chipW/2, chipY+27);
    ctx.fillStyle='#000';
  }
  y=chipY+chipH+16;
  ctx.fillRect(M, y, W-2*M, 2);
  y+=18;

  // --- machine-readable code -------------------------------------------
  const bandH = (codeType==='qr') ? 186 : 118;
  if(codeType==='none'||!codeValue){
    status.textContent = codeType==='none' ? '不顯示條碼。' : '填入內容才會顯示條碼／QR Code。';
    y+=bandH;
  }else if(codeType==='barcode'){
    const v=codeValue.toUpperCase();
    if(!/^\/[A-Z0-9]{7}$/.test(v) && !/^[0-9A-Z.\- $/+%]+$/.test(v)){
      status.textContent='一維碼只支援 0-9 A-Z 與 - . 空白 $ / + %，例如 /SM6OLEQ。';
      y+=bandH;
    }else{
      status.textContent='一維碼預覽：'+v;
      drawCode39(v, M, y, W-2*M, bandH);
      y+=bandH;
    }
  }else{
    status.textContent='QR Code 預覽：'+codeValue;
    const size=bandH, x=(W-size)/2;
    drawQr(codeValue, x, y, size);
    drawQrBrackets(x, y, size);      // corner brackets, as the reference has
    y+=bandH;
  }

  // --- url / payload caption -------------------------------------------
  if(codeValue){
    ctx.fillStyle='#000';
    ctx.font='700 13px "PingFang TC","Noto Sans TC",sans-serif';
    ctx.textAlign='center';
    ctx.fillText(codeValue, W/2, y+16);
    y+=26;
  }

  // --- hatched footer ---------------------------------------------------
  hatchFooter(W,y2(W,H));
  solidifyRegion(0,0,W,H,200);
}
function y2(){ return H; }

// Reverse the pixels of one rectangle in place: dark -> white, everything else
// -> black. Used to draw the logo reversed out of the black title band, which
// is what the reference achieves with `filter: brightness(0) invert(1)`.
function reverseInPlace(rx,ry,rw,rh){
  const x0=Math.max(0,Math.floor(rx)), y0=Math.max(0,Math.floor(ry));
  const x1=Math.min(W,Math.ceil(rx+rw)), y1=Math.min(H,Math.ceil(ry+rh));
  const iw=x1-x0, ih=y1-y0;
  if(iw<=0||ih<=0) return;
  const img=ctx.getImageData(x0,y0,iw,ih), d=img.data;
  for(let p=0;p<iw*ih;p++){
    const i=p*4;
    const lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const v=lum<128?255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,x0,y0);
}

// Centre-draw text with extra letter spacing (the reference's letter-spacing).
function drawTracked(text,cx,baseY,spacing){
  let w=0;
  for(const ch of text) w+=ctx.measureText(ch).width+spacing;
  w-=spacing;
  let x=cx-w/2;
  const prevAlign=ctx.textAlign; ctx.textAlign='left';
  for(const ch of text){ ctx.fillText(ch,x,baseY); x+=ctx.measureText(ch).width+spacing; }
  ctx.textAlign=prevAlign;
}

// Four corner brackets around the QR, as the reference draws them.
function drawQrBrackets(x,y,size){
  const L=26, T=5;
  ctx.fillStyle='#000';
  ctx.fillRect(x,y,L,T);            ctx.fillRect(x,y,T,L);
  ctx.fillRect(x+size-L,y,L,T);     ctx.fillRect(x+size-T,y,T,L);
  ctx.fillRect(x,y+size-T,L,T);     ctx.fillRect(x,y+size-T,T,L);
  ctx.fillRect(x+size-L,y+size-T,L,T); ctx.fillRect(x+size-T,y+size-T,T,L);
}

// 10px black / 10px white at 45 degrees, filling the last FOOT px of the panel.
function hatchFooter(){
  const FOOT=16, top=H-FOOT, step=10;
  ctx.fillStyle='#fff'; ctx.fillRect(0,top,W,FOOT);
  ctx.fillStyle='#000';
  for(let x=-FOOT;x<W+FOOT;x+=step*2){
    ctx.beginPath();
    ctx.moveTo(x,top); ctx.lineTo(x+step,top);
    ctx.lineTo(x+step-FOOT,top+FOOT); ctx.lineTo(x-FOOT,top+FOOT);
    ctx.closePath(); ctx.fill();
  }
}

function makeBmp(){
  const rowBytes=60; // 480 px / 8 = 60, already 4-byte aligned
  const dataSize=rowBytes*H, fileSize=14+40+8+dataSize;
  const buf=new ArrayBuffer(fileSize), dv=new DataView(buf), u8=new Uint8Array(buf);
  dv.setUint16(0,0x4D42,true); dv.setUint32(2,fileSize,true); dv.setUint32(10,62,true);
  dv.setUint32(14,40,true); dv.setInt32(18,W,true); dv.setInt32(22,H,true);
  dv.setUint16(26,1,true); dv.setUint16(28,1,true); dv.setUint32(30,0,true); dv.setUint32(34,dataSize,true);
  dv.setUint32(38,2835,true); dv.setUint32(42,2835,true); dv.setUint32(46,2,true); dv.setUint32(50,2,true);
  u8[54]=0;u8[55]=0;u8[56]=0;u8[57]=0; u8[58]=255;u8[59]=255;u8[60]=255;u8[61]=0; // 0=black,1=white
  const img=ctx.getImageData(0,0,W,H).data;
  let p=62;
  for(let row=H-1;row>=0;row--){            // BMP is bottom-up
    for(let bx=0;bx<rowBytes;bx++){
      let byte=0;
      for(let b=0;b<8;b++){ const x=bx*8+b; const i=(row*W+x)*4; const bit=img[i]<128?0:1; byte|=(bit<<(7-b)); }
      u8[p++]=byte;
    }
  }
  return new Blob([buf],{type:'image/bmp'});
}

async function save(){
  render();
  const fd=new FormData();
  fd.append('file', makeBmp(), 'badge.bmp');
  setStatus('上傳中…');
  try{
    const r=await fetch('/upload?path=/.crosspoint',{method:'POST',body:fd});
    if(!r.ok) throw new Error(await r.text());
    setStatus('已存到 /.crosspoint/badge.bmp ✔ 到裝置設定選「名牌」即可。');
  }catch(e){ setStatus('上傳失敗：'+e.message); }
}
function setStatus(t){document.getElementById('status').textContent=t;}

logoImg.onload=render;
logoImg.onerror=render;
// Restore the remembered form only now that every declaration above has been
// evaluated. loadForm() renders, and render() reaches drawCode39(), which reads
// the `const CODE39_CHARS` tables declared above this line; calling it earlier
// threw a TDZ ReferenceError that silently killed both the preview and save().
loadForm();
if(logoImg.complete) render(); else render();
</script>
